<h2>Learning Resources</h2>


{% for resource in resources %}

<div>

<h3>
{{ resource.title }}
</h3>

<p>
{{ resource.description }}
</p>


{% if resource.file %}

<a href="{{ resource.file.url }}">
Open File
</a>

{% endif %}


{% if resource.url %}

<a href="{{ resource.url }}">
External Link
</a>

{% endif %}

</div>

<hr>


{% empty %}

<p>
No resources available.
</p>

{% endfor %}
