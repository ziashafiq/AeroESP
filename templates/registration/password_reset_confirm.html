{% extends "aeroesp/base.html" %}

{% block title %}
Set New Password | AeroESP
{% endblock %}

{% block content %}

<h1>Set New Password</h1>

{% if validlink %}

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Change Password
    </button>

</form>

{% else %}

<p>
    This password reset link is invalid
    or has expired.
</p>

{% endif %}

{% endblock %}
