{% extends "aeroesp/base.html" %}

{% block title %}
Reset Password | AeroESP
{% endblock %}

{% block content %}

<h1>Reset Password</h1>

<p>
    Enter the email address associated
    with your AeroESP account.
</p>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Send Reset Link
    </button>

</form>

{% endblock %}
