{% extends "aeroesp/public_base.html" %}


{% block title %}
Reset Password · AeroESP
{% endblock %}


{% block content %}


<section class="auth-card">

<h1>
Reset Password
</h1>


<p>
Enter your email address.
A password reset link will be sent to you.
</p>


<form method="post">

{% csrf_token %}

{{ form.as_p }}


<button
type="submit"
class="auth-submit"
>
Send Reset Link
</button>


</form>


</section>


{% endblock %}
