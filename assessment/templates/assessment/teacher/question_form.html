<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>
</head>

<body>

    <h1>{{ page_title }}</h1>

    <p>
        Logged in as:
        {{ request.user.username }}
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            {{ submit_label }}
        </button>

    </form>

    <hr>

    <a href="{% url 'teacher_questions:list' %}">
        Back to Question Bank
    </a>

</body>
</html>
